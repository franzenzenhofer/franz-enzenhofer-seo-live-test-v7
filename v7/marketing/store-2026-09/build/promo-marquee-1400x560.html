<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  :root { --w: 1400px; --h: 560px; }
  .beam { right: 30%; top: -70%; width: 22%; height: 240%; }
  .copy { position: absolute; left: 74px; top: 104px; z-index: 5; width: 570px; }
  .eyebrow { font-size: 20px; }
  .headline { font-size: 68px; margin-top: 18px; }
  .chip { font-size: 27px; padding: 11px 20px 13px; margin-top: 28px; }
  .deck img { position: absolute; }
  .win { width: 720px; border-radius: 12px;
         box-shadow: 0 40px 90px rgba(0,0,0,.78), 0 0 0 1px rgba(255,255,255,.07); }
  .pan { width: 296px; border-radius: 10px;
         box-shadow: 0 26px 60px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.12); }
  #wg { left: 676px;  top: 118px; transform: perspective(1700px) rotateY(15deg) rotate(-1.6deg); }
  #pw { left: 1138px; top: 152px; transform: rotate(0.8deg); }
</style></head>
<body><div class="stage">
  <div class="beam soft"></div><div class="beam"></div>
  <div class="copy">
    <div class="eyebrow">Franz Enzenhofer SEO Live Test</div>
    <h1 class="headline">MY SEO SECRET SAUCE.</h1>
    <div class="chip">120+ CHECKS. FREE.</div>
  </div>
  <div class="deck">
    <img id="wg" class="win" src="img/guardian-win-1400.png" alt="">
    <img id="pw" class="pan" src="img/wikipedia-panel-540.png" alt="">
  </div>
</div></body></html>
